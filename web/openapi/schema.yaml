openapi: 3.0.3
info:
  title: Barterly API
  version: 0.1.0
  description: Work-exchange marketplace for travel and hospitality in India.
paths:
  /api/v1/agreement-versions/{version_id}/decline/:
    post:
      operationId: agreements_decline_change
      description: Turn down a new version (or withdraw your own). The version in
        force stays.
      summary: Decline a change
      parameters:
      - in: path
        name: version_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - agreements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclineChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeclineChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeclineChange'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreement'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/agreement-versions/{version_id}/pdf/:
    get:
      operationId: agreements_pdf
      description: A link valid for 10 minutes, with the SHA-256 the PDF must match.
      summary: Open a version's PDF
      parameters:
      - in: path
        name: version_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - agreements
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdfLink'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/agreement-versions/{version_id}/sign/:
    get:
      operationId: agreements_sign_challenge
      description: 'The consent statement and how to prove it: method otp means re-run
        phone OTP sign-in just before signing and send the new ID token.'
      summary: What signing needs
      parameters:
      - in: path
        name: version_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - agreements
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    post:
      operationId: agreements_sign
      description: Records your consent with the time, IP address and device. The
        agreement is in force once both sides have signed the same version.
      summary: Sign a version
      parameters:
      - in: path
        name: version_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - agreements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Sign'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Sign'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Sign'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreement'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/agreements/:
    get:
      operationId: agreements_list
      description: Newest first, with whether one is waiting for your signature.
      summary: Your agreements
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - agreements
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAgreementListItemList'
          description: ''
  /api/v1/agreements/{agreement_id}/:
    get:
      operationId: agreements_retrieve
      summary: An agreement
      parameters:
      - in: path
        name: agreement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - agreements
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
