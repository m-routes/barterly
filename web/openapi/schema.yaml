components:
  schemas:
    Accepted:
      type: object
      properties:
        booking:
          type: string
          format: uuid
        agreement_version:
          type: string
          format: uuid
          description: Version 1 of the agreement, for both of you to sign.
      required:
      - agreement_version
      - booking
    ActionEnum:
      enum:
      - shortlist
      - reject
      type: string
      description: |-
        * `shortlist` - shortlist
        * `reject` - reject
    AddPhoto:
      type: object
      properties:
        media_id:
          type: string
          format: uuid
          description: A confirmed upload of kind 'photo'.
        caption:
          type: string
          maxLength: 200
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        captured_at:
          type: string
          format: date-time
      required:
      - media_id
    AdminCase:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        check_type:
          allOf:
          - $ref: '#/components/schemas/CheckTypeEnum'
          readOnly: true
        subject_type:
          allOf:
          - $ref: '#/components/schemas/SubjectTypeEnum'
          readOnly: true
        property_id:
          type: string
          format: uuid
