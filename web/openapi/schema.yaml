          type: integer
          maximum: 6
          minimum: 1
        days_per_week:
          type: integer
          maximum: 6
          minimum: 1
          description: 'At most 6: everyone gets at least one day off.'
        stay_type:
          $ref: '#/components/schemas/StayTypeEnum'
        meals:
          $ref: '#/components/schemas/MealsEnum'
        stipend_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          description: INR. Hybrid and paid gigs only.
        stipend_period:
          default: ''
          oneOf:
          - $ref: '#/components/schemas/StipendPeriodEnum'
          - $ref: '#/components/schemas/BlankEnum'
        deliverables:
          type: array
          items:
            $ref: '#/components/schemas/TermsDeliverable'
        usage_rights:
          allOf:
          - $ref: '#/components/schemas/UsageRights'
          nullable: true
          description: How the host may use the talent's content. Barter and hybrid
            gigs only.
        cancellation_policy:
          $ref: '#/components/schemas/CancellationPolicyEnum'
      required:
      - cancellation_policy
      - compensation_model
      - days_per_week
      - end_date
      - hours_per_day
      - meals
      - start_date
      - stay_type
    TermsDeliverable:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/DeliverableTypeEnum'
        quantity:
          type: integer
          maximum: 50
          minimum: 1
        notes:
          type: string
          default: ''
          maxLength: 300
      required:
      - quantity
      - type
    TimelineEntry:
      type: object
      properties:
        status:
          type: string
        at:
          type: string
          format: date-time
        reason:
          type: string
      required:
      - at
      - reason
      - status
    TokenPair:
      type: object
      properties:
        access:
          type: string
          description: 'Short-lived JWT. Send as `Authorization: Bearer`.'
        refresh:
          type: string
          description: Exchange at /api/v1/auth/refresh/ for new tokens.
      required:
      - access
      - refresh
    Unlocked:
      type: object
      description: |-
        Shared once both have signed: each side's verified phone, and for the talent the
        exact address and directions.
      properties:
        booking_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/BookingStatusEnum'
        host:
          $ref: '#/components/schemas/Contact'
        talent:
          $ref: '#/components/schemas/Contact'
        place:
          allOf:
          - $ref: '#/components/schemas/Place'
          nullable: true
          description: For the talent only.
      required:
      - booking_id
      - host
      - place
      - status
      - talent
    Unread:
      type: object
      properties:
        unread:
          type: integer
          description: Unread messages across all conversations.
        conversations:
          type: integer
          description: Conversations with unread messages.
      required:
      - conversations
      - unread
    UnreadCount:
      type: object
      properties:
        unread:
          type: integer
      required:
      - unread
    UpdatePreferences:
      type: object
      properties:
        locale:
          $ref: '#/components/schemas/NotificationLocaleEnum'
        quiet_hours_enabled:
          type: boolean
        quiet_start:
          type: string
          format: time
        quiet_end:
          type: string
          format: time
        changes:
          type: array
          items:
            $ref: '#/components/schemas/PreferenceChange'
    UploadUrlRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/KindEnum'
        content_type:
          $ref: '#/components/schemas/ContentTypeEnum'
        size_bytes:
          type: integer
          minimum: 1
        checksum_md5:
          description: Optional hex MD5. If sent, Cloud Storage rejects a body that
            doesn't match.
          oneOf:
          - type: string
            pattern: ^[0-9a-fA-F]{32}$
          - type: string
            maxLength: 0
      required:
      - content_type
      - kind
      - size_bytes
    UploadUrlResponse:
      type: object
      properties:
        media_id:
          type: string
          format: uuid
        upload_url:
          type: string
          format: uri
        method:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
          description: Send exactly these headers with the upload.
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - headers
      - media_id
      - method
      - upload_url
    UsageRights:
      type: object
      properties:
        scope:
          $ref: '#/components/schemas/ScopeEnum'
        duration_months:
          type: integer
          maximum: 36
          minimum: 1
        credit_required:
          type: boolean
          description: The host credits the talent (name or handle) when using the
            content.
      required:
      - credit_required
      - duration_months
      - scope
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        phone:
          type: string
          readOnly: true
          description: Login identifier, stored in E.164 (e.g. +919876543210).
        email:
          type: string
          format: email
          readOnly: true
          nullable: true
        role:
          readOnly: true
          description: |-
            "" until the user picks vendor or talent at /api/v1/me/role/.

            * `vendor` - Vendor
            * `talent` - Talent
            * `admin` - Admin
          oneOf:
          - $ref: '#/components/schemas/UserRoleEnum'
          - $ref: '#/components/schemas/BlankEnum'
        is_active:
          type: boolean
          readOnly: true
          description: Unset instead of deleting accounts. Changes are audit-logged.
        profile_complete:
          type: boolean
          readOnly: true
          description: True once the user has a role and the matching profile.
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
      - is_active
      - phone
      - profile_complete
      - role
    UserRoleEnum:
      enum:
      - vendor
      - talent
      - admin
      type: string
      description: |-
        * `vendor` - Vendor
        * `talent` - Talent
        * `admin` - Admin
    VendorApplication:
      type: object
      description: The applicant view plus the vendor's private notes, tags and rejection
        code.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        gig:
          type: string
          format: uuid
          readOnly: true
        gig_title:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
        status_reason:
          type: string
          readOnly: true
          description: Shown to the applicant (e.g. why it was rejected).
        pitch:
          type: string
          readOnly: true
        answers:
          readOnly: true
          description: Answers to the gig's screening questions, in order.
        proposed_start:
          type: string
          format: date
          readOnly: true
        proposed_end:
          type: string
          format: date
          readOnly: true
        applicant:
          allOf:
          - $ref: '#/components/schemas/Applicant'
          readOnly: true
        fit:
          allOf:
          - $ref: '#/components/schemas/Fit'
          readOnly: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          readOnly: true
        applied_at:
          type: string
          format: date-time
          readOnly: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        status_changed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the status last changed (for stale interviews).
        offer_expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Set when an offer is made; the talent must answer by then.
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEntry'
          readOnly: true
          description: Every status change, with the reason given.
        interview:
          allOf:
          - $ref: '#/components/schemas/Interview'
          nullable: true
          readOnly: true
        rejection_code:
          type: string
          readOnly: true
          description: apps.hiring.templates.RejectionReason, when rejected.
        notes:
          type: array
          items:
            $ref: '#/components/schemas/Note'
          readOnly: true
        tags:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - answers
      - applicant
      - applied_at
      - attachments
      - decided_at
      - fit
      - gig
      - gig_title
      - id
      - interview
      - notes
      - offer_expires_at
      - pitch
      - proposed_end
      - proposed_start
      - rejection_code
      - status
      - status_changed_at
      - status_reason
      - tags
      - timeline
    VendorApplicationListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        gig:
          type: string
          format: uuid
          readOnly: true
        gig_title:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
        status_reason:
          type: string
          readOnly: true
          description: Shown to the applicant (e.g. why it was rejected).
        proposed_start:
          type: string
          format: date
          readOnly: true
        proposed_end:
          type: string
          format: date
          readOnly: true
        applicant:
          allOf:
          - $ref: '#/components/schemas/Applicant'
          readOnly: true
        fit:
          allOf:
          - $ref: '#/components/schemas/Fit'
          readOnly: true
        attachment_count:
          type: integer
          readOnly: true
        conversation:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: The chat about this application, once it's open (apps.chat).
        unread_messages:
          type: integer
          readOnly: true
          default: 0
        agreement:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: The agreement, once the application is booked (apps.agreements).
        applied_at:
          type: string
          format: date-time
          readOnly: true
        rejection_code:
          type: string
          readOnly: true
        tags:
          type: array
          items:
            type: string
          readOnly: true
        note_count:
          type: integer
          readOnly: true
      required:
      - agreement
      - applicant
      - applied_at
      - attachment_count
      - conversation
      - fit
      - gig
      - gig_title
      - id
      - note_count
      - proposed_end
      - proposed_start
      - rejection_code
      - status
      - status_reason
      - tags
      - unread_messages
    VendorProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        business_name:
          type: string
          maxLength: 150
        business_type:
          oneOf:
          - $ref: '#/components/schemas/BusinessTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        contact_name:
          type: string
          maxLength: 80
        city:
          type: string
          maxLength: 80
        state:
          oneOf:
          - $ref: '#/components/schemas/StateEnum'
          - $ref: '#/components/schemas/BlankEnum'
        about:
          type: string
          maxLength: 3000
        address:
          type: string
          maxLength: 500
        gstin:
          type: string
          description: 15-character GSTIN
          maxLength: 15
        website:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        profile_complete:
          type: boolean
          readOnly: true
        missing_fields:
          type: array
          items:
            type: string
          readOnly: true
          description: Fields still empty that stop the profile counting as complete.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - missing_fields
      - profile_complete
      - updated_at
    VendorStatus:
      type: object
      description: |-
        The moves a vendor makes on an application (the transition table decides if
        they're allowed from the current status). Rejecting needs a reason_code; the
        applicant sees its text plus the optional message.
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/VendorStatusStatusEnum'
          description: |-
            To offer, send the terms: POST /api/v1/applications/{id}/offer/.

            * `shortlisted` - shortlisted
            * `interview` - interview
            * `rejected` - rejected
        reason_code:
          $ref: '#/components/schemas/RejectionReasonEnum'
        message:
          type: string
          maxLength: 400
      required:
      - status
    VendorStatusStatusEnum:
      enum:
      - shortlisted
      - interview
      - rejected
      type: string
      description: |-
        * `shortlisted` - shortlisted
        * `interview` - interview
        * `rejected` - rejected
    VerificationDocumentStatusEnum:
      enum:
      - pending
      - verified
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `verified` - Verified
        * `failed` - Failed
    VerificationDocumentTypeEnum:
      enum:
      - aadhaar
      - passport
      - driving_licence
      - voter_id
      - selfie
      - pan
      - gstin
      - property_photo
      - certificate
      type: string
      description: |-
        * `aadhaar` - Aadhaar
        * `passport` - Passport
        * `driving_licence` - Driving licence
        * `voter_id` - Voter ID
        * `selfie` - Selfie
        * `pan` - PAN
        * `gstin` - GSTIN
        * `property_photo` - Property photo
        * `certificate` - Certificate
    VerificationStatusEnum:
      enum:
      - not_started
      - submitted
      - in_review
      - approved
      - rejected
      - changes_requested
      - expired
      type: string
      description: |-
        * `not_started` - Not started
        * `submitted` - Submitted
        * `in_review` - In review
        * `approved` - Approved
        * `rejected` - Rejected
        * `changes_requested` - Changes requested
        * `expired` - Expired
    WebhookResponse:
      type: object
      properties:
        outcome:
          type: string
      required:
      - outcome
    Withdraw:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
