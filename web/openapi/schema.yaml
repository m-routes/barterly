  /api/v1/gigs/:
    get:
      operationId: gigs_discover
      description: Live gigs still taking applications that you're eligible for (languages,
        minimum followers), filtered by your choices, then sorted. `best_fit` orders
        by a 0-100 fit score (skills 30, reliability 25, ratings 20, audience quality
        15, distance and availability 10); `fit.breakdown` explains it, and components
        without data use a neutral 0.5. Distances use each property's approximate
        location. Pass `next_cursor` back as `cursor` for the next page.
      summary: Find gigs (talent)
      parameters:
      - in: query
        name: city
        schema:
          type: string
          maxLength: 80
          minLength: 1
      - in: query
        name: compensation_model
        schema:
          type: array
          items:
            enum:
            - volunteer
            - barter
            - hybrid
            - paid
            type: string
            description: |-
              * `volunteer` - Volunteer (work for stay)
              * `barter` - Barter (content for stay)
              * `hybrid` - Hybrid (stay plus stipend)
              * `paid` - Paid
      - in: query
        name: latitude
        schema:
          type: number
          format: double
          maximum: 90
          minimum: -90
      - in: query
        name: longitude
        schema:
          type: number
          format: double
          maximum: 180
          minimum: -180
      - in: query
        name: min_stay
        schema:
          type: integer
          maximum: 365
          minimum: 1
        description: 'How many days you can stay: hides gigs that need a longer minimum
          stay.'
      - in: query
        name: q
        schema:
          type: string
          maxLength: 200
          minLength: 1
        description: Keywords.
      - in: query
        name: radius_km
        schema:
          type: number
          format: double
          maximum: 1000
          minimum: 1
      - in: query
        name: role
        schema:
          type: array
          items:
            enum:
            - volunteer
            - content_creator
            - trip_leader
            - specialist
            type: string
            description: |-
              * `volunteer` - Volunteer
              * `content_creator` - Content creator
              * `trip_leader` - Trip leader
              * `specialist` - Specialist
      - in: query
        name: sort
        schema:
          enum:
          - best_fit
          - newest
          - start_date
          - distance
          type: string
          default: best_fit
          minLength: 1
        description: |-
          * `best_fit` - best_fit
          * `newest` - newest
          * `start_date` - start_date
          * `distance` - distance
      - in: query
        name: start_from
        schema:
          type: string
          format: date
        description: Gigs starting on or after.
      - in: query
        name: start_to
        schema:
          type: string
          format: date
        description: Gigs starting on or before.
      - in: query
        name: stay_type
        schema:
          type: array
          items:
            enum:
            - none
            - dorm_bed
            - shared_room
            - private_room
            - tent
            type: string
            description: |-
              * `none` - No stay
              * `dorm_bed` - Dorm bed
              * `shared_room` - Shared room
              * `private_room` - Private room
              * `tent` - Tent / camping
      - in: query
        name: verified_hosts
        schema:
          type: boolean
          nullable: true
      - in: query
        name: women_friendly
        schema:
          type: boolean
          nullable: true
      tags:
      - discovery
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GigPage'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    post:
      operationId: gigs_create
      description: 'Drafts may be incomplete. The full rules apply on submit: at most
        6 hours a day and 6 days a week, a start date in the future, at least 1 slot,
        stay and meals for volunteer gigs, a deliverable for barter gigs, and a stipend
