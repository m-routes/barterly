openapi: 3.0.3
info:
  title: Barterly API
  version: 0.1.0
  description: Work-exchange marketplace for travel and hospitality in India.
paths:
  /api/v1/admin/attendance/{check_in_id}/review/:
    post:
      operationId: attendance_admin_flag_review
      summary: Mark a flagged check-in reviewed (admin)
      parameters:
      - in: path
        name: check_in_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - attendance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagReview'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FlagReview'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FlagReview'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckIn'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/admin/attendance/flagged/:
    get:
      operationId: attendance_admin_flagged
      description: Far from the property, not yet reviewed. Oldest first.
      summary: Check-ins flagged for review (admin)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - attendance
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCheckInList'
          description: ''
  /api/v1/admin/flags/:
    get:
      operationId: flags_admin_list
      summary: Feature flags (admin)
      tags:
      - flags
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Flag'
          description: ''
  /api/v1/admin/flags/{key}/:
    post:
      operationId: flags_admin_set
      description: A reason is required; the change is audited.
      summary: Turn a feature flag on or off (admin)
      parameters:
      - in: path
        name: key
        schema:
          type: string
        required: true
      tags:
      - flags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetFlag'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetFlag'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetFlag'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flag'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/admin/money/escrows/{booking_id}/decide/:
    post:
      operationId: money_admin_decide
      description: Release it all to the talent, refund it all to the host, or split
        it (talent_paise to the talent, the rest refunded). Works on a disputed (frozen)
        escrow. Audited, with the note.
      summary: Decide a held escrow (admin)
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - money
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscrowDecision'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EscrowDecision'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EscrowDecision'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Escrow'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/admin/money/kill-switch/:
    get:
      operationId: money_admin_kill_switch
      description: 'Paused here or by the ESCROW_PAUSED setting: no funding or payouts.'
      summary: The escrow kill switch (admin)
      tags:
      - money
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KillSwitch'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    put:
      operationId: money_admin_kill_switch_set
      summary: Pause or resume escrow funding and payouts (admin)
      tags:
      - money
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KillSwitch'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/KillSwitch'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/KillSwitch'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KillSwitch'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/admin/money/payout-runs/:
    get:
      operationId: money_admin_payout_runs
      description: 'Newest first: what each run sent, held back (and why) and failed.'
      summary: Payout runs (admin)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - money
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPayoutRunList'
          description: ''
    post:
      operationId: money_admin_payout_run_start
      summary: Start a payout run now (admin)
      tags:
      - money
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutRunDetail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/admin/money/payout-runs/{run_id}/:
    get:
      operationId: money_admin_payout_run
      summary: One payout run and its payouts (admin)
      parameters:
      - in: path
        name: run_id
        schema:
          type: integer
        required: true
      tags:
      - money
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutRunDetail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/admin/money/payouts/:
    get:
      operationId: money_admin_payouts
      description: Newest first. `status=failed` with `needs_admin=true` lists the
        payouts that ran out of automatic retries.
      summary: Payouts (admin)
      parameters:
      - in: query
        name: needs_admin
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - creating
          - failed
          - processed
          - processing
          - reversed
      tags:
      - money
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPayoutList'
          description: ''
  /api/v1/admin/money/payouts/{payout_id}/retry/:
    post:
      operationId: money_admin_payout_retry
      description: The latest failed attempt of an escrow; skips the back-off. Audited.
      summary: Retry a failed payout now (admin)
      parameters:
      - in: path
        name: payout_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - money
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutRetry'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PayoutRetry'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PayoutRetry'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutRunDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/admin/money/reconciliation/:
    get:
      operationId: money_admin_reconciliation
      description: 'The last 30 days: ledger totals against the gateway''s, in paise.'
      summary: Recent daily reconciliations (admin)
      tags:
      - money
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReconciliationRun'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/admin/reviews/{review_id}/moderate/:
    post:
      operationId: reviews_admin_moderate
      description: Removing hides it and stops it counting. Audited, with the note.
      summary: Allow or remove a review (admin)
      parameters:
      - in: path
        name: review_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - reviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Moderation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Moderation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Moderation'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StayReview'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/admin/reviews/queue/:
    get:
      operationId: reviews_admin_queue
      description: Held for flagged words or contact details, or reported. Oldest
        first.
      summary: Reviews waiting for moderation (admin)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - reviews
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQueueItemList'
          description: ''
  /api/v1/agreement-versions/{version_id}/decline/:
    post:
      operationId: agreements_decline_change
      description: Turn down a new version (or withdraw your own). The version in
        force stays.
      summary: Decline a change
      parameters:
      - in: path
        name: version_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - agreements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclineChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeclineChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeclineChange'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreement'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/agreement-versions/{version_id}/pdf/:
    get:
      operationId: agreements_pdf
      description: A link valid for 10 minutes, with the SHA-256 the PDF must match.
