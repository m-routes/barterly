          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreement'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/applicant-filters/:
    get:
      operationId: hiring_filters_list
      summary: My saved applicant filters
      tags:
      - hiring
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedFilter'
          description: ''
    post:
      operationId: hiring_filters_create
      summary: Save an applicant filter
      tags:
      - hiring
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedFilter'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SavedFilter'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SavedFilter'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedFilter'
          description: ''
  /api/v1/applicant-filters/{filter_id}/:
    get:
      operationId: hiring_filters_retrieve
      summary: One saved filter
      parameters:
      - in: path
        name: filter_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - hiring
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedFilter'
          description: ''
    patch:
      operationId: hiring_filters_update
      summary: Rename or change a filter
      parameters:
      - in: path
        name: filter_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - hiring
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSavedFilter'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSavedFilter'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSavedFilter'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedFilter'
          description: ''
    delete:
      operationId: hiring_filters_delete
      summary: Delete a saved filter
      parameters:
      - in: path
        name: filter_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - hiring
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/applications/{application_id}/:
    get:
      operationId: applications_retrieve
      description: For the applicant, the gig's vendor, or an admin. Attachments have
        short-lived signed URLs. Badges show the applicant's verification; contact
        details are never included.
      summary: One application
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - applications
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorApplication'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/applications/{application_id}/accept/:
    post:
      operationId: applications_accept
      description: The application becomes confirmed and a booking is created awaiting
        signatures; it takes a slot once both sides sign the agreement. Refused (409)
        when the offer has expired, the gig has no slot left, or you already have
        a booking for those dates.
      summary: Accept an offer
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bookings
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/applications/{application_id}/conversation/:
    post:
      operationId: chat_open
      description: Vendors only. Talent can reply once the vendor has shortlisted
        or messaged them. Returns 201 when the conversation is new.
      summary: Open (or get) the chat with an applicant
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - chat
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetail'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/applications/{application_id}/decline/:
    post:
      operationId: applications_decline
      description: Declines the host's offer waiting for your answer (see offers_decline).
      summary: Decline an offer
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Withdraw'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Withdraw'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Withdraw'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/applications/{application_id}/interview/:
    get:
      operationId: hiring_interview_retrieve
      description: Times are UTC (ISO 8601) with India-time text alongside.
      summary: The interview being arranged (applicant or vendor)
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - hiring
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interview'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    post:
      operationId: hiring_interview_propose
      description: Up to three times, at least an hour ahead and within 60 days, plus
        a video link. Moves the application to the interview stage if it isn't there
        yet, and replaces an interview still being arranged.
      summary: Propose interview times (vendor)
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - hiring
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposeInterview'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProposeInterview'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProposeInterview'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interview'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
