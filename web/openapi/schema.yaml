          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/gigs/{gig_id}/status/:
    post:
      operationId: gigs_status_change
      description: 'Vendor: draft→in_review (submit), in_review→draft (withdraw),
        live→paused, paused→live, live/paused/filled→closed, draft/closed→archived.
        Admin: in_review→live (approve), in_review→draft (send back, with a reason),
        pause, close, archive. Filled, auto-close and re-review happen on their own.'
      summary: Change a gig's status
      parameters:
      - in: path
        name: gig_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - gigs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StatusChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StatusChange'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gig'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/gigs/admin/:
    get:
      operationId: gigs_admin_list
      description: In-review gigs by default, oldest submission first.
      summary: Gig review queue
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - archived
          - closed
          - draft
          - filled
          - in_review
          - live
          - paused
      tags:
      - gigs
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGigList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/gigs/mine/:
    get:
      operationId: gigs_mine_list
      summary: My gigs (vendor)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - archived
          - closed
          - draft
          - filled
          - in_review
          - live
          - paused
      tags:
      - gigs
      security:
      - jwtAuth: []
      - cookieAuth: []
