components:
  schemas:
    AddPhoto:
      type: object
      properties:
        media_id:
          type: string
          format: uuid
          description: A confirmed upload of kind 'photo'.
        caption:
          type: string
          maxLength: 200
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        captured_at:
          type: string
          format: date-time
      required:
      - media_id
    AdminCase:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        check_type:
          allOf:
          - $ref: '#/components/schemas/CheckTypeEnum'
          readOnly: true
        subject_type:
          allOf:
          - $ref: '#/components/schemas/SubjectTypeEnum'
          readOnly: true
        property_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/VerificationStatusEnum'
          readOnly: true
        reason:
          type: string
          readOnly: true
          description: Why it was rejected or what to change. Shown to the user.
        details:
          readOnly: true
          description: 'Non-sensitive facts for the reviewer: pin, masked numbers,
            reference contact.'
        submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        approved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        documents:
          type: array
          items:
            $ref: '#/components/schemas/AdminDocument'
          readOnly: true
        user_id:
          type: string
          format: uuid
          readOnly: true
        user_phone:
          type: string
          readOnly: true
        user_role:
          type: string
          readOnly: true
        reviewer_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
      required:
      - approved_at
      - check_type
      - details
      - documents
      - expires_at
      - id
      - property_id
      - reason
      - reviewed_at
      - reviewer_id
      - status
      - subject_type
      - submitted_at
      - user_id
      - user_phone
      - user_role
    AdminDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        document_type:
          $ref: '#/components/schemas/VerificationDocumentTypeEnum'
        status:
          $ref: '#/components/schemas/VerificationDocumentStatusEnum'
        masked_value:
          type: string
          description: Last four characters only.
          maxLength: 4
        media_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        metadata:
          description: E.g. a photo's location or a certificate's title.
        created_at:
          type: string
          format: date-time
          readOnly: true
        provider:
          type: string
          default: ''
          description: KYC provider name.
          maxLength: 40
        provider_reference:
          type: string
          default: ''
          description: The provider's id for this check.
          maxLength: 128
      required:
      - created_at
      - document_type
      - id
      - media_id
    AmenitiesEnum:
      enum:
      - air_conditioning
      - breakfast
      - cctv
      - common_area
      - female_dorm
      - first_aid
      - hot_water
      - kitchen
      - laundry
      - lockers
      - parking
      - pet_friendly
      - power_backup
      - wifi
      - workspace
      type: string
      description: |-
        * `air_conditioning` - Air conditioning
        * `breakfast` - Breakfast
        * `cctv` - CCTV in common areas
        * `common_area` - Common area
        * `female_dorm` - Female-only dorm
        * `first_aid` - First aid
        * `hot_water` - Hot water
        * `kitchen` - Shared kitchen
        * `laundry` - Laundry
        * `lockers` - Lockers
        * `parking` - Parking
        * `pet_friendly` - Pet friendly
        * `power_backup` - Power backup
        * `wifi` - Wi-Fi
        * `workspace` - Workspace
    Applicant:
      type: object
      description: |-
        Who applied. Deliberately no phone, email, emergency contact, birth date or
        social handle: contact happens on Barterly once there's a booking.
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        talent_type:
          type: string
        home_city:
          type: string
        bio:
          type: string
        languages:
          type: array
          items:
            type: string
        skills:
          type: array
          items:
            type: string
        instagram_followers:
          type: integer
          nullable: true
        badges:
          type: array
          items:
            type: string
          description: Active badge kinds.
      required:
      - badges
      - bio
      - display_name
      - home_city
      - instagram_followers
      - languages
      - skills
      - talent_type
      - user_id
    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        gig:
          type: string
          format: uuid
          readOnly: true
        gig_title:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
        status_reason:
          type: string
          readOnly: true
        pitch:
          type: string
          readOnly: true
        answers:
          readOnly: true
          description: Answers to the gig's screening questions, in order.
        proposed_start:
          type: string
          format: date
          readOnly: true
        proposed_end:
          type: string
          format: date
          readOnly: true
        applicant:
          allOf:
          - $ref: '#/components/schemas/Applicant'
          readOnly: true
        fit:
          allOf:
          - $ref: '#/components/schemas/Fit'
          readOnly: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          readOnly: true
        applied_at:
          type: string
          format: date-time
          readOnly: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - answers
      - applicant
      - applied_at
      - attachments
      - decided_at
      - fit
      - gig
      - gig_title
      - id
      - pitch
      - proposed_end
      - proposed_start
      - status
      - status_reason
    ApplicationListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        gig:
          type: string
          format: uuid
          readOnly: true
        gig_title:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
        proposed_start:
          type: string
          format: date
          readOnly: true
        proposed_end:
          type: string
          format: date
          readOnly: true
        applicant:
          allOf:
          - $ref: '#/components/schemas/Applicant'
          readOnly: true
        fit:
          allOf:
          - $ref: '#/components/schemas/Fit'
          readOnly: true
        attachment_count:
          type: integer
          readOnly: true
        applied_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - applicant
      - applied_at
      - attachment_count
      - fit
      - gig
      - gig_title
      - id
      - proposed_end
      - proposed_start
      - status
    ApplicationStatusEnum:
      enum:
      - applied
      - withdrawn
      - shortlisted
      - interview
      - offered
      - declined
      - rejected
      - expired
      type: string
      description: |-
        * `applied` - Applied
        * `withdrawn` - Withdrawn
        * `shortlisted` - Shortlisted
        * `interview` - Interview
        * `offered` - Offered
        * `declined` - Declined
        * `rejected` - Rejected
        * `expired` - Expired
    Apply:
      type: object
      properties:
        pitch:
          type: string
          maxLength: 2000
        answers:
          type: array
          items:
            type: string
            maxLength: 1000
          description: One answer per screening question, in order.
        proposed_start:
          type: string
          format: date
        proposed_end:
          type: string
          format: date
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentInput'
      required:
      - pitch
      - proposed_end
      - proposed_start
    ApproximateLocation:
      type: object
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        radius_m:
          type: integer
          description: The property is within this distance.
      required:
      - latitude
      - longitude
      - radius_m
    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/AttachmentKindEnum'
          readOnly: true
        title:
          type: string
          readOnly: true
        url:
          type: string
          format: uri
          nullable: true
          readOnly: true
          description: Signed and short-lived for uploads.
        thumb_url:
          type: string
          format: uri
          nullable: true
          readOnly: true
      required:
      - id
      - kind
      - thumb_url
      - title
      - url
    AttachmentInput:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/AttachmentKindEnum'
        media_id:
          type: string
          format: uuid
          description: Your upload (photo, video, document).
        url:
          type: string
          format: uri
          description: For kind 'link' only.
          maxLength: 500
        title:
          type: string
          maxLength: 120
      required:
      - kind
    AttachmentKindEnum:
      enum:
      - photo
      - video
      - document
      - link
      type: string
      description: |-
        * `photo` - Photo
        * `video` - Video
        * `document` - Document
        * `link` - Link
    Badge:
      type: object
      properties:
        kind:
          allOf:
          - $ref: '#/components/schemas/BadgeKindEnum'
          readOnly: true
        granted_at:
          type: string
          format: date-time
          readOnly: true
        grant_reason:
          type: string
          readOnly: true
        case_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
      required:
      - case_id
      - grant_reason
      - granted_at
      - kind
    BadgeKindEnum:
      enum:
      - id_verified
      - property_verified
      - licence_verified
      - social_verified
      - reference_checked
      - trusted_member
      type: string
      description: |-
        * `id_verified` - ID verified
        * `property_verified` - Property verified
        * `licence_verified` - Licence verified
        * `social_verified` - Social verified
        * `reference_checked` - Reference checked
        * `trusted_member` - Trusted member
    BlankEnum:
      enum:
      - ''
    Blocked:
      type: object
      properties:
        code:
          type: string
          default: application_blocked
        message:
          type: string
        details:
          type: object
          additionalProperties: {}
          description: '{"reasons": [{"code", "message"}, ...]}'
      required:
      - details
      - message
    BusinessCheck:
      type: object
      properties:
        pan:
          type: string
          description: 10 characters, e.g. ABCPE1234F.
          maxLength: 10
        gstin:
          type: string
          description: Optional. Defaults to the GSTIN on your profile.
          maxLength: 15
      required:
      - pan
    BusinessTypeEnum:
      enum:
      - hostel
      - homestay
      - guesthouse
      - hotel
      - resort
      - cafe
      - restaurant
