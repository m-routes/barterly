      description: Opens a session with the KYC provider. Run the provider's capture
        flow with `client_token` (SDK) or `redirect_url` (hosted page); the result
        arrives by webhook. Images never pass through Barterly. Starting again on
        an approved check (new or changed ID) sends it back to review and removes
        the ID badge until approved.
