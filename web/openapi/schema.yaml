      - travel
      - other_work
      - property_unavailable
      - staffing
      - slots_filled
      - not_signed
      - admin
      type: string
      description: |-
        * `emergency` - A personal or family emergency
        * `safety` - A safety or conduct concern
        * `plans_changed` - Plans changed
        * `other` - Something else
