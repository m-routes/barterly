          maxLength: 15
        website:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        profile_complete:
          type: boolean
          readOnly: true
        missing_fields:
          type: array
          items:
            type: string
          readOnly: true
          description: Fields still empty that stop the profile counting as complete.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - missing_fields
      - profile_complete
      - updated_at
    VendorStatus:
      type: object
      description: |-
        The moves a vendor makes on an application (the transition table decides if
        they're allowed from the current status). Rejecting needs a reason_code; the
        applicant sees its text plus the optional message.
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/VendorStatusStatusEnum'
          description: |-
            To offer, send the terms: POST /api/v1/applications/{id}/offer/.

            * `shortlisted` - shortlisted
            * `interview` - interview
            * `rejected` - rejected
        reason_code:
          $ref: '#/components/schemas/RejectionReasonEnum'
        message:
          type: string
          maxLength: 400
      required:
      - status
    VendorStatusStatusEnum:
      enum:
      - shortlisted
      - interview
      - rejected
      type: string
      description: |-
        * `shortlisted` - shortlisted
        * `interview` - interview
        * `rejected` - rejected
    VerificationDocumentStatusEnum:
      enum:
      - pending
      - verified
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `verified` - Verified
        * `failed` - Failed
    VerificationDocumentTypeEnum:
      enum:
      - aadhaar
      - passport
      - driving_licence
      - voter_id
      - selfie
      - pan
      - gstin
      - property_photo
      - certificate
      type: string
      description: |-
        * `aadhaar` - Aadhaar
        * `passport` - Passport
        * `driving_licence` - Driving licence
        * `voter_id` - Voter ID
        * `selfie` - Selfie
        * `pan` - PAN
        * `gstin` - GSTIN
        * `property_photo` - Property photo
        * `certificate` - Certificate
    VerificationStatusEnum:
      enum:
      - not_started
      - submitted
      - in_review
      - approved
      - rejected
      - changes_requested
      - expired
      type: string
      description: |-
        * `not_started` - Not started
        * `submitted` - Submitted
        * `in_review` - In review
        * `approved` - Approved
        * `rejected` - Rejected
        * `changes_requested` - Changes requested
        * `expired` - Expired
    Wallet:
      type: object
      properties:
        pending_paise:
          type: integer
          description: Held in escrow, not yet released.
        pending_net_estimate_paise:
          type: integer
          description: Roughly what pending would pay you, after commission, GST and
            TDS.
        available_paise:
          type: integer
          description: Released to you, not yet paid out.
        in_transit_paise:
          type: integer
        paid_out_paise:
          type: integer
        tds_this_year_paise:
          type: integer
        financial_year:
          type: string
        payout_account:
          allOf:
          - $ref: '#/components/schemas/PayoutAccount'
          nullable: true
        on_hold_reason:
          type: string
          description: Why payouts wait, as a code; or empty.
        on_hold_message:
          type: string
        can_request_payout:
          type: boolean
      required:
      - available_paise
      - can_request_payout
      - financial_year
      - in_transit_paise
      - on_hold_message
      - on_hold_reason
      - paid_out_paise
      - payout_account
      - pending_net_estimate_paise
      - pending_paise
      - tds_this_year_paise
    WalletEntry:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/WalletEntryKindEnum'
        at:
          type: string
          format: date-time
        amount_paise:
          type: integer
          description: 'Release: your net; payout: the amount.'
        status:
          type: string
        booking_id:
          type: string
          format: uuid
        gig_title:
          type: string
        gross_paise:
          type: integer
        commission_paise:
          type: integer
        commission_gst_paise:
          type: integer
        tds_paise:
          type: integer
        account:
          type: string
        reference:
          type: string
        failure_reason:
          type: string
      required:
      - account
      - amount_paise
      - at
      - booking_id
      - commission_gst_paise
      - commission_paise
      - failure_reason
      - gig_title
      - gross_paise
      - kind
      - reference
      - status
      - tds_paise
    WalletEntryKindEnum:
      enum:
      - release
      - payout
      type: string
      description: |-
        * `release` - release
        * `payout` - payout
    WebhookResponse:
      type: object
      properties:
        outcome:
          type: string
      required:
      - outcome
    Withdraw:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
    WriteReview:
      type: object
      properties:
        rating:
          type: integer
          maximum: 5
          minimum: 1
        communication:
          type: integer
          maximum: 5
          minimum: 1
        accuracy:
          type: integer
          maximum: 5
          minimum: 1
          description: 'Reviewing a host: accuracy of the listing. A talent: work
            quality.'
        safety:
          type: integer
          maximum: 5
          minimum: 1
        reliability:
          type: integer
          maximum: 5
          minimum: 1
          description: 'Reviewing a host: payment as agreed. A talent: punctuality.'
        text:
          type: string
          maxLength: 2000
      required:
      - accuracy
      - communication
      - rating
      - reliability
      - safety
      - text
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
