    TalentProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        display_name:
          type: string
          maxLength: 120
        bio:
          type: string
          maxLength: 2000
        talent_type:
          oneOf:
          - $ref: '#/components/schemas/TalentTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        skills:
          type: array
          items:
            type: string
          description: Skill slugs from GET /api/v1/profiles/skills/.
        languages:
          type: array
          items:
            $ref: '#/components/schemas/LanguagesEnum'
          description: ISO 639 codes, e.g. ['en', 'hi'].
          maxItems: 10
        home_city:
          type: string
          maxLength: 80
        emergency_contact_name:
          type: string
          maxLength: 80
        emergency_contact_phone:
          type: string
          description: E.164
          maxLength: 16
        date_of_birth:
          type: string
          format: date
          nullable: true
        instagram_handle:
          description: With or without the @.
          oneOf:
          - type: string
            pattern: ^[A-Za-z0-9._]{1,30}$
            maxLength: 31
          - type: string
            maxLength: 0
        profile_complete:
          type: boolean
          readOnly: true
        missing_fields:
          type: array
          items:
            type: string
          readOnly: true
          description: Fields still empty that stop the profile counting as complete.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - missing_fields
      - profile_complete
      - updated_at
    TalentTypeEnum:
      enum:
      - artist
      - photo_video
      - content_creator
      - musician
      - wellness
      - culinary
      - hospitality
      - teacher
      - tech
      - outdoor
      - other
      type: string
      description: |-
        * `artist` - Artist / muralist
        * `photo_video` - Photographer / videographer
        * `content_creator` - Content creator / social media
        * `musician` - Musician / performer
        * `wellness` - Yoga / wellness
        * `culinary` - Chef / barista
        * `hospitality` - Hospitality / front desk
        * `teacher` - Teacher / workshop host
        * `tech` - Tech / design
        * `outdoor` - Outdoor / trek guide
        * `other` - Other
    TokenPair:
      type: object
      properties:
        access:
          type: string
          description: 'Short-lived JWT. Send as `Authorization: Bearer`.'
        refresh:
          type: string
          description: Exchange at /api/v1/auth/refresh/ for new tokens.
      required:
      - access
      - refresh
    UploadUrlRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/KindEnum'
        content_type:
          $ref: '#/components/schemas/ContentTypeEnum'
        size_bytes:
          type: integer
          minimum: 1
        checksum_md5:
          description: Optional hex MD5. If sent, Cloud Storage rejects a body that
            doesn't match.
          oneOf:
          - type: string
            pattern: ^[0-9a-fA-F]{32}$
          - type: string
            maxLength: 0
      required:
      - content_type
      - kind
      - size_bytes
    UploadUrlResponse:
      type: object
      properties:
        media_id:
          type: string
          format: uuid
        upload_url:
          type: string
          format: uri
        method:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
          description: Send exactly these headers with the upload.
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - headers
      - media_id
      - method
      - upload_url
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        phone:
          type: string
          readOnly: true
          description: Login identifier, stored in E.164 (e.g. +919876543210).
        email:
          type: string
          format: email
          readOnly: true
          nullable: true
        role:
          readOnly: true
          description: |-
            "" until the user picks vendor or talent at /api/v1/me/role/.

            * `vendor` - Vendor
            * `talent` - Talent
            * `admin` - Admin
          oneOf:
          - $ref: '#/components/schemas/UserRoleEnum'
          - $ref: '#/components/schemas/BlankEnum'
        is_active:
          type: boolean
          readOnly: true
          description: Unset instead of deleting accounts. Changes are audit-logged.
        profile_complete:
          type: boolean
          readOnly: true
          description: True once the user has a role and the matching profile.
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
      - is_active
      - phone
      - profile_complete
      - role
    UserRoleEnum:
      enum:
      - vendor
      - talent
      - admin
      type: string
      description: |-
        * `vendor` - Vendor
        * `talent` - Talent
        * `admin` - Admin
    VendorProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        business_name:
          type: string
          maxLength: 150
        business_type:
          oneOf:
          - $ref: '#/components/schemas/BusinessTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        contact_name:
          type: string
          maxLength: 80
        city:
          type: string
          maxLength: 80
        state:
          oneOf:
          - $ref: '#/components/schemas/StateEnum'
          - $ref: '#/components/schemas/BlankEnum'
        about:
          type: string
          maxLength: 3000
        address:
          type: string
          maxLength: 500
        gstin:
          type: string
          description: 15-character GSTIN
          maxLength: 15
        website:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        profile_complete:
          type: boolean
          readOnly: true
        missing_fields:
          type: array
          items:
            type: string
          readOnly: true
          description: Fields still empty that stop the profile counting as complete.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - missing_fields
      - profile_complete
      - updated_at
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
