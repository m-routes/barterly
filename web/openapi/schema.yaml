components:
  schemas:
    Accepted:
      type: object
      properties:
        booking:
          type: string
          format: uuid
        agreement_version:
          type: string
          format: uuid
          description: Version 1 of the agreement, for both of you to sign.
      required:
      - agreement_version
      - booking
    ActionEnum:
      enum:
      - shortlist
      - reject
      type: string
      description: |-
        * `shortlist` - shortlist
        * `reject` - reject
    AddPhoto:
      type: object
      properties:
        media_id:
          type: string
          format: uuid
          description: A confirmed upload of kind 'photo'.
        caption:
          type: string
          maxLength: 200
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        captured_at:
          type: string
          format: date-time
      required:
      - media_id
    AdminCase:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        check_type:
          allOf:
          - $ref: '#/components/schemas/CheckTypeEnum'
          readOnly: true
        subject_type:
          allOf:
          - $ref: '#/components/schemas/SubjectTypeEnum'
          readOnly: true
        property_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/VerificationStatusEnum'
          readOnly: true
        reason:
          type: string
          readOnly: true
          description: Why it was rejected or what to change. Shown to the user.
        details:
          readOnly: true
          description: 'Non-sensitive facts for the reviewer: pin, masked numbers,
            reference contact.'
        submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        approved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        documents:
          type: array
          items:
            $ref: '#/components/schemas/AdminDocument'
          readOnly: true
        user_id:
          type: string
          format: uuid
          readOnly: true
        user_phone:
          type: string
          readOnly: true
        user_role:
          type: string
          readOnly: true
        reviewer_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
      required:
      - approved_at
      - check_type
      - details
      - documents
      - expires_at
      - id
      - property_id
      - reason
      - reviewed_at
      - reviewer_id
      - status
      - subject_type
      - submitted_at
      - user_id
      - user_phone
      - user_role
    AdminDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        document_type:
          $ref: '#/components/schemas/VerificationDocumentTypeEnum'
        status:
          $ref: '#/components/schemas/VerificationDocumentStatusEnum'
        masked_value:
          type: string
          description: Last four characters only.
          maxLength: 4
        media_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        metadata:
          description: E.g. a photo's location or a certificate's title.
        created_at:
          type: string
          format: date-time
          readOnly: true
        provider:
          type: string
          default: ''
          description: KYC provider name.
          maxLength: 40
        provider_reference:
          type: string
          default: ''
          description: The provider's id for this check.
          maxLength: 128
      required:
      - created_at
      - document_type
      - id
      - media_id
    Agreement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        booking:
          type: string
          format: uuid
          readOnly: true
        booking_status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
        gig_title:
          type: string
          readOnly: true
        in_force:
          type: boolean
          readOnly: true
        current_version:
          type: integer
          readOnly: true
          nullable: true
        my_side:
          allOf:
          - $ref: '#/components/schemas/PartyEnum'
          readOnly: true
        versions:
          type: array
          items:
            $ref: '#/components/schemas/AgreementVersion'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - booking
      - booking_status
      - created_at
      - current_version
      - gig_title
      - id
      - in_force
      - my_side
      - versions
    AgreementListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        booking:
          type: string
          format: uuid
          readOnly: true
        booking_status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
        gig_title:
          type: string
          readOnly: true
        other_name:
          type: string
          readOnly: true
        start_date:
          type: string
          format: date
          readOnly: true
        end_date:
          type: string
          format: date
          readOnly: true
        in_force:
          type: boolean
          readOnly: true
        current_version:
          type: integer
          readOnly: true
          nullable: true
        awaiting_version:
          type: integer
          nullable: true
          readOnly: true
          description: The version waiting for signatures, if any.
        awaiting_my_signature:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - awaiting_my_signature
      - awaiting_version
      - booking
      - booking_status
      - created_at
      - current_version
      - end_date
      - gig_title
      - id
      - in_force
      - other_name
      - start_date
    AgreementVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        number:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AgreementVersionStatusEnum'
          readOnly: true
        status_reason:
          type: string
          readOnly: true
        terms:
          allOf:
          - $ref: '#/components/schemas/Terms'
          readOnly: true
        terms_sha256:
          type: string
          readOnly: true
        changed_fields:
          type: array
          items:
            type: string
          readOnly: true
          description: What this version changes.
        change_reason:
          type: string
          readOnly: true
        proposed_by:
          description: Which side asked for this change; empty for version 1.
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/PartyEnum'
          - $ref: '#/components/schemas/BlankEnum'
        template:
          type: string
          readOnly: true
          description: The template the PDF was drawn up with (apps.agreements.pdf).
        template_reviewed:
          type: boolean
          readOnly: true
          description: False while the legal text is a placeholder no lawyer has reviewed.
        pdf_ready:
          type: boolean
          readOnly: true
        pdf_sha256:
          type: string
          readOnly: true
        pdf_size:
          type: integer
          readOnly: true
          nullable: true
        signatures:
          type: array
          items:
            $ref: '#/components/schemas/Signature'
          readOnly: true
        signed_by_me:
          type: boolean
          readOnly: true
        can_sign:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        in_force_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - can_sign
      - change_reason
      - changed_fields
      - created_at
      - id
      - in_force_at
      - number
      - pdf_ready
      - pdf_sha256
      - pdf_size
      - proposed_by
      - signatures
      - signed_by_me
      - status
      - status_reason
      - template
      - template_reviewed
      - terms
      - terms_sha256
    AgreementVersionStatusEnum:
      enum:
      - awaiting
      - active
      - superseded
      - declined
      - voided
      type: string
      description: |-
        * `awaiting` - Waiting for signatures
        * `active` - In force
        * `superseded` - Replaced by a later version
        * `declined` - Change declined
        * `voided` - Replaced before it was signed
    AmenitiesEnum:
      enum:
      - air_conditioning
      - breakfast
      - cctv
      - common_area
      - female_dorm
      - first_aid
      - hot_water
      - kitchen
      - laundry
      - lockers
      - parking
      - pet_friendly
      - power_backup
      - wifi
      - workspace
      type: string
      description: |-
        * `air_conditioning` - Air conditioning
        * `breakfast` - Breakfast
        * `cctv` - CCTV in common areas
        * `common_area` - Common area
        * `female_dorm` - Female-only dorm
        * `first_aid` - First aid
        * `hot_water` - Hot water
        * `kitchen` - Shared kitchen
        * `laundry` - Laundry
        * `lockers` - Lockers
        * `parking` - Parking
        * `pet_friendly` - Pet friendly
        * `power_backup` - Power backup
        * `wifi` - Wi-Fi
        * `workspace` - Workspace
    Answer:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
    Applicant:
      type: object
      description: |-
        Who applied. Deliberately no phone, email, emergency contact, birth date or
        social handle: contact happens on Barterly once there's a booking.
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        talent_type:
          type: string
        home_city:
          type: string
        bio:
          type: string
        languages:
          type: array
          items:
            type: string
        skills:
          type: array
          items:
            type: string
        instagram_followers:
          type: integer
          nullable: true
        badges:
          type: array
          items:
            type: string
          description: Active badge kinds.
        reliability:
          allOf:
          - $ref: '#/components/schemas/Reliability'
          description: Their reliability as talent (v1).
      required:
      - badges
      - bio
      - display_name
      - home_city
      - instagram_followers
      - languages
      - reliability
      - skills
      - talent_type
      - user_id
    Application:
      type: object
      description: |-
        What the applicant (and the vendor) sees. Never the vendor's notes or tags:
        those are only in apps.hiring.serializers.VendorApplicationSerializer.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        gig:
          type: string
          format: uuid
          readOnly: true
        gig_title:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
        status_reason:
          type: string
          readOnly: true
          description: Shown to the applicant (e.g. why it was rejected).
        pitch:
          type: string
          readOnly: true
        answers:
          readOnly: true
          description: Answers to the gig's screening questions, in order.
        proposed_start:
          type: string
          format: date
          readOnly: true
        proposed_end:
          type: string
          format: date
          readOnly: true
        applicant:
          allOf:
          - $ref: '#/components/schemas/Applicant'
          readOnly: true
        fit:
          allOf:
          - $ref: '#/components/schemas/Fit'
          readOnly: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          readOnly: true
        applied_at:
          type: string
          format: date-time
          readOnly: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        status_changed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the status last changed (for stale interviews).
        offer_expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Set when an offer is made; the talent must answer by then.
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEntry'
          readOnly: true
          description: Every status change, with the reason given.
        interview:
          allOf:
          - $ref: '#/components/schemas/Interview'
          nullable: true
          readOnly: true
      required:
      - answers
      - applicant
      - applied_at
      - attachments
      - decided_at
      - fit
      - gig
      - gig_title
      - id
      - interview
      - offer_expires_at
      - pitch
      - proposed_end
      - proposed_start
      - status
      - status_changed_at
      - status_reason
      - timeline
    ApplicationListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        gig:
          type: string
          format: uuid
          readOnly: true
        gig_title:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
        status_reason:
          type: string
          readOnly: true
          description: Shown to the applicant (e.g. why it was rejected).
        proposed_start:
          type: string
          format: date
          readOnly: true
        proposed_end:
          type: string
          format: date
          readOnly: true
        applicant:
          allOf:
          - $ref: '#/components/schemas/Applicant'
          readOnly: true
        fit:
          allOf:
          - $ref: '#/components/schemas/Fit'
          readOnly: true
        attachment_count:
          type: integer
          readOnly: true
        conversation:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: The chat about this application, once it's open (apps.chat).
        unread_messages:
          type: integer
          readOnly: true
          default: 0
        agreement:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: The agreement, once the application is booked (apps.agreements).
        applied_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - agreement
      - applicant
      - applied_at
      - attachment_count
      - conversation
      - fit
      - gig
      - gig_title
      - id
      - proposed_end
      - proposed_start
      - status
      - status_reason
      - unread_messages
    ApplicationStatusEnum:
      enum:
      - applied
      - withdrawn
      - shortlisted
      - interview
      - offered
      - declined
      - rejected
      - expired
      - confirmed
      type: string
      description: |-
        * `applied` - Applied
        * `withdrawn` - Withdrawn
        * `shortlisted` - Shortlisted
        * `interview` - Interview
        * `offered` - Offered
        * `declined` - Declined
        * `rejected` - Rejected
        * `expired` - Expired
        * `confirmed` - Confirmed
    Apply:
      type: object
      properties:
        pitch:
          type: string
          maxLength: 2000
        answers:
          type: array
          items:
            type: string
            maxLength: 1000
          description: One answer per screening question, in order.
        proposed_start:
          type: string
          format: date
        proposed_end:
          type: string
          format: date
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentInput'
      required:
      - pitch
      - proposed_end
      - proposed_start
    ApproximateLocation:
      type: object
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        radius_m:
          type: integer
          description: The property is within this distance.
      required:
      - latitude
      - longitude
      - radius_m
    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/AttachmentKindEnum'
          readOnly: true
        title:
          type: string
          readOnly: true
