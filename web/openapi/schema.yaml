openapi: 3.0.3
info:
  title: Barterly API
  version: 0.1.0
  description: Work-exchange marketplace for travel and hospitality in India.
paths:
  /api/v1/applications/{application_id}/:
    get:
      operationId: applications_retrieve
      description: For the applicant, the gig's vendor, or an admin. Attachments have
        short-lived signed URLs. Badges show the applicant's verification; contact
        details are never included.
      summary: One application
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - applications
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/applications/{application_id}/withdraw/:
    post:
      operationId: applications_withdraw
      description: Allowed while the application is active, up to accepting an offer.
      summary: Withdraw my application
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Withdraw'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Withdraw'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Withdraw'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/applications/mine/:
    get:
      operationId: applications_mine_list
      summary: My applications (talent)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - applications
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApplicationListItemList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/exchange/:
    post:
      operationId: auth_exchange
      description: Verifies the ID token from Firebase phone sign-in, creates the
        user on first sign-in, and returns a short-lived access token and a refresh
        token. Rate limited per IP and per phone number.
      summary: Exchange an OTP provider ID token for API tokens
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExchangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExchangeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout
      description: |-
        Revoke a refresh token. Holding the token is proof enough, so no access token is
        needed (it may already have expired).
      summary: Sign out by blacklisting the refresh token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '204':
          description: Signed out.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh
      description: 'Rotating refresh: the old refresh token is blacklisted once used.'
      summary: Get a new access token (and a new refresh token)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/geo/geocode/:
    post:
      operationId: geo_geocode
      description: 'For a ''find on map'' button: call once when the vendor asks,
        never on each keystroke (OpenStreetMap''s Nominatim policy forbids autocomplete).
        Answers are cached. Use the point to place a pin the vendor then confirms
        or moves.'
      summary: Find an address on the map
      tags:
      - geo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeocodeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GeocodeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GeocodeRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeocodeResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/gigs/:
    get:
      operationId: gigs_discover
      description: Live gigs still taking applications that you're eligible for (languages,
        minimum followers), filtered by your choices, then sorted. `best_fit` orders
        by a 0-100 fit score (skills 30, reliability 25, ratings 20, audience quality
        15, distance and availability 10); `fit.breakdown` explains it, and components
        without data use a neutral 0.5. Distances use each property's approximate
        location. Pass `next_cursor` back as `cursor` for the next page.
      summary: Find gigs (talent)
      parameters:
      - in: query
        name: city
        schema:
          type: string
          maxLength: 80
          minLength: 1
      - in: query
        name: compensation_model
        schema:
          type: array
          items:
            enum:
            - volunteer
            - barter
            - hybrid
            - paid
            type: string
            description: |-
              * `volunteer` - Volunteer (work for stay)
              * `barter` - Barter (content for stay)
              * `hybrid` - Hybrid (stay plus stipend)
              * `paid` - Paid
      - in: query
        name: latitude
        schema:
          type: number
          format: double
          maximum: 90
          minimum: -90
      - in: query
        name: longitude
        schema:
          type: number
          format: double
          maximum: 180
          minimum: -180
      - in: query
        name: min_stay
        schema:
          type: integer
          maximum: 365
          minimum: 1
        description: 'How many days you can stay: hides gigs that need a longer minimum
          stay.'
      - in: query
        name: q
        schema:
          type: string
          maxLength: 200
          minLength: 1
        description: Keywords.
      - in: query
        name: radius_km
        schema:
          type: number
          format: double
          maximum: 1000
          minimum: 1
      - in: query
        name: role
        schema:
          type: array
          items:
            enum:
            - volunteer
            - content_creator
            - trip_leader
            - specialist
            type: string
            description: |-
              * `volunteer` - Volunteer
              * `content_creator` - Content creator
              * `trip_leader` - Trip leader
              * `specialist` - Specialist
      - in: query
        name: sort
        schema:
          enum:
          - best_fit
          - newest
          - start_date
          - distance
          type: string
          default: best_fit
          minLength: 1
        description: |-
          * `best_fit` - best_fit
          * `newest` - newest
          * `start_date` - start_date
          * `distance` - distance
      - in: query
        name: start_from
        schema:
          type: string
          format: date
        description: Gigs starting on or after.
      - in: query
        name: start_to
        schema:
          type: string
          format: date
        description: Gigs starting on or before.
      - in: query
        name: stay_type
        schema:
          type: array
          items:
            enum:
            - none
            - dorm_bed
            - shared_room
            - private_room
            - tent
            type: string
            description: |-
              * `none` - No stay
              * `dorm_bed` - Dorm bed
              * `shared_room` - Shared room
              * `private_room` - Private room
              * `tent` - Tent / camping
      - in: query
        name: verified_hosts
        schema:
          type: boolean
          nullable: true
      - in: query
        name: women_friendly
        schema:
          type: boolean
          nullable: true
      tags:
      - discovery
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GigPage'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    post:
      operationId: gigs_create
      description: 'Drafts may be incomplete. The full rules apply on submit: at most
        6 hours a day and 6 days a week, a start date in the future, at least 1 slot,
        stay and meals for volunteer gigs, a deliverable for barter gigs, and a stipend
        above zero for hybrid and paid gigs.'
      summary: Start a gig (as a draft)
      tags:
      - gigs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Gig'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Gig'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Gig'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gig'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/gigs/{gig_id}/:
    get:
      operationId: gigs_retrieve
      summary: One gig (its vendor or an admin)
      parameters:
      - in: path
        name: gig_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - gigs
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gig'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    patch:
      operationId: gigs_update
      description: Draft, in-review, live and paused gigs can be edited. Changing
        the pay, hours or dates of a live or paused gig sends it back to review.
      summary: Edit a gig
      parameters:
      - in: path
        name: gig_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - gigs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedGig'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedGig'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedGig'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gig'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/gigs/{gig_id}/applications/:
    get:
      operationId: gig_applications_list
      description: Sorted by fit score by default. No contact details are shared.
      summary: Applicants for my gig (vendor)
      parameters:
      - in: path
        name: gig_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: min_score
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - fit
          - newest
          - oldest
      - in: query
        name: status
        schema:
          type: string
        description: Comma list of statuses.
      tags:
      - applications
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApplicationListItemList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    post:
      operationId: gig_applications_create
      description: 'Needs a complete profile, the gig''s verification level, the gig''s
        languages and follower minimum, dates inside the gig that meet its minimum
        stay, and an answer to every screening question. If anything fails, a 422
        lists every reason in `details.reasons`. Attachments: up to 8 of your uploads
        or https links.'
      summary: Apply to a gig (talent)
      parameters:
      - in: path
        name: gig_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Apply'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Apply'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Apply'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blocked'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/gigs/{gig_id}/public/:
    get:
      operationId: gigs_public_retrieve
      description: The description and screening questions of a gig talent can apply
        to (live, still taking applications, property not removed). Other gigs are
        404.
      summary: A live gig, as talent see it
      parameters:
      - in: path
        name: gig_id
        schema:
          type: string
