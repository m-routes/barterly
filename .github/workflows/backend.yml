name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "web/openapi/schema.yaml"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "web/openapi/schema.yaml"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

env:
  # Tests use config.settings.local (pyproject.toml). Staging and production settings
  # are exercised by apps/core/tests/test_settings.py, including check --deploy.
  DATABASE_URL: postgres://barterly:barterly@localhost:5432/barterly

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: barterly
          POSTGRES_PASSWORD: barterly
          POSTGRES_DB: barterly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U barterly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - name: Django system check
        run: uv run python manage.py check --fail-level WARNING
      - name: Migration check
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Apply migrations
        run: uv run python manage.py migrate --noinput
      - name: OpenAPI schema validates
        run: uv run python manage.py spectacular --validate --fail-on-warn --file openapi.yaml
      - name: Web client schema is up to date
        # web/ generates its typed API client from this file. If this fails, run
        # `npm run api:generate` in web/ and commit both files.
        run: diff -u ../web/openapi/schema.yaml openapi.yaml
      - name: Tests
        run: uv run pytest --cov --cov-report=term --cov-report=xml
      - name: Coverage gate (services >= 85%)
        run: uv run coverage report --include='apps/*/services/*' --fail-under=85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/openapi.yaml

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - name: pip-audit on locked runtime and dev dependencies
        run: |
          uv export --locked --no-hashes --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uv run --locked pip-audit --strict -r "$RUNNER_TEMP/requirements.txt"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: barterly-api:ci
          cache-from: type=gha,scope=api
      - name: Image runs as non-root and boots gunicorn
        run: |
          test "$(docker run --rm --entrypoint id barterly-api:ci -u)" != "0"
          docker run --rm -e DJANGO_SETTINGS_MODULE=config.settings.local barterly-api:ci \
            gunicorn --check-config -c gunicorn.conf.py config.asgi:application
