name: acceptance

# The regression and acceptance suite against staging (docs/qa/README.md):
# - Playwright journeys and failure scenarios, desktop and 390 px;
# - the talent's journeys in the Flutter app on three Android emulators (low, mid and
#   high spec) and one iOS simulator.
#
# Runs nightly, on demand, and on every release candidate: each successful staging
# deploy from main is the candidate a production tag would promote.
# Runs one at a time (they share the personas in backend/apps/qa/personas.json).

on:
  schedule:
    - cron: "30 21 * * *" # 03:00 IST
  workflow_dispatch:
  workflow_run:
    workflows: [deploy]
    types: [completed]
    branches: [main]

concurrency:
  group: acceptance-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Workload Identity: run the QA job on staging

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: asia-south1
  ACCEPTANCE_WEB_URL: ${{ vars.STAGING_WEB_URL }}
  ACCEPTANCE_API_URL: ${{ vars.STAGING_API_URL }}
  STAGING_API_URL: ${{ vars.STAGING_API_URL }}
  E2E_OTP_CODE: ${{ secrets.E2E_OTP_CODE }}
  E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
  E2E_FIREBASE_API_KEY: ${{ vars.E2E_FIREBASE_API_KEY }}
  E2E_FIREBASE_AUTH_DOMAIN: ${{ vars.E2E_FIREBASE_AUTH_DOMAIN }}
  E2E_FIREBASE_PROJECT_ID: ${{ vars.E2E_FIREBASE_PROJECT_ID }}
  E2E_FIREBASE_APP_ID: ${{ vars.E2E_FIREBASE_APP_ID }}

jobs:
  web:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        project: [desktop, phone-390]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Journeys and failure scenarios (${{ matrix.project }})
        run: scripts/acceptance.sh staging ${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-web-${{ matrix.project }}
          path: |
            web/acceptance-report
            web/test-results
          retention-days: 14

  android:
    needs: web
    if: always() && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: low # an entry-level phone: old Android, little memory
            api-level: 29
            profile: Nexus 5
            ram: 2048
          - name: mid
            api-level: 33
            profile: pixel_4a
            ram: 4096
          - name: high
            api-level: 35
            profile: pixel_8_pro
            ram: 8192
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Firebase keys (never committed)
        env:
          FIREBASE_KEYS_JSON: ${{ secrets.FIREBASE_KEYS_JSON }}
        run: printf '%s' "$FIREBASE_KEYS_JSON" > env/firebase-keys.json
      - run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Talent journeys on ${{ matrix.name }}-spec Android (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          profile: ${{ matrix.profile }}
          ram-size: ${{ matrix.ram }}M
          arch: x86_64
          disable-animations: true
          working-directory: mobile
          script: tool/acceptance.sh staging emulator-5554

  ios:
    needs: android
    if: always() && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Firebase keys (never committed)
        env:
          FIREBASE_KEYS_JSON: ${{ secrets.FIREBASE_KEYS_JSON }}
        run: printf '%s' "$FIREBASE_KEYS_JSON" > env/firebase-keys.json
      - run: flutter pub get
      - name: Boot an iPhone simulator
        id: sim
        run: |
          udid="$(xcrun simctl list devices available -j |
            python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for r,v in sorted(d.items(),reverse=True) if 'iOS' in r for x in v if x['name'].startswith('iPhone')))")"
          xcrun simctl boot "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Talent journeys on the iOS simulator
        run: tool/acceptance.sh staging "${{ steps.sim.outputs.udid }}"
