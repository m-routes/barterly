name: deploy

# main  -> build images, deploy to staging.
# v*.*.* tag -> wait for approval (GitHub environment "production": required reviewers,
#               deployments limited to v*.*.* tags), then promote the exact images
#               staging ran for that commit. Production never rebuilds. After a good
#               deploy, publish the GitHub release with notes from the merged PRs.
#               docs/release.md has the checklist.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - "mobile/**"
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read
  id-token: write # GitHub OIDC -> GCP Workload Identity Federation (no keys)

env:
  REGION: asia-south1
  REPOSITORY: barterly

jobs:
  staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.WEB_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/web:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT_WEB=${{ vars.SENTRY_PROJECT_WEB }}
            MEDIA_CDN_ORIGINS=${{ vars.MEDIA_CDN_ORIGINS }}
          # Uploads source maps to Sentry when the secret exists; skipped otherwise.
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Migrate, smoke test, shift traffic
        env:
          # Also checked through the load balancer when set (docs/edge.md).
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          PUBLIC_WEB_URL: ${{ vars.PUBLIC_WEB_URL }}
        run: infra/scripts/deploy.sh staging "${GITHUB_SHA}"

  production:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the GitHub release
      id-token: write
    # Required reviewers on this GitHub environment provide the manual approval.
    environment:
      name: production
      url: ${{ vars.WEB_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and main's history, for the checks and release notes

      - name: Check the tag is a release of a commit on main
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::${GITHUB_REF_NAME} is not a release tag (vMAJOR.MINOR.PATCH)."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at a commit that is not on main."
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Check the images for this commit exist (built by the staging deploy)
        run: |
          for component in api web; do
            image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${component}:${GITHUB_SHA}"
            if ! gcloud artifacts docker images describe "$image" --quiet >/dev/null; then
              echo "::error::${image} not found. Tag a commit that has been merged to main and deployed to staging."
              exit 1
            fi
          done

      - name: Migrate, smoke test, shift traffic
        env:
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          PUBLIC_WEB_URL: ${{ vars.PUBLIC_WEB_URL }}
        run: infra/scripts/deploy.sh production "${GITHUB_SHA}"

      # Notes from the PRs merged since the previous release tag, grouped by label
      # (.github/release.yml). CHANGELOG.md gets the same notes in the release PR
      # (infra/scripts/changelog.sh).
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists (a re-run)."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
