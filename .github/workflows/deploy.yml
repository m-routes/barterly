name: deploy

# main  -> build images, deploy to staging.
# v*.*.* tag -> wait for approval (GitHub environment "production"), then promote the
#               exact images staging ran for that commit. Production never rebuilds.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - "mobile/**"
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read
  id-token: write # GitHub OIDC -> GCP Workload Identity Federation (no keys)

env:
  REGION: asia-south1
  REPOSITORY: barterly

jobs:
  staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.WEB_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Migrate, smoke test, shift traffic
        run: infra/scripts/deploy.sh staging "${GITHUB_SHA}"

  production:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Required reviewers on this GitHub environment provide the manual approval.
    environment:
      name: production
      url: ${{ vars.WEB_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Check the images for this commit exist (built by the staging deploy)
        run: |
          for component in api web; do
            image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${component}:${GITHUB_SHA}"
            if ! gcloud artifacts docker images describe "$image" --quiet >/dev/null; then
              echo "::error::${image} not found. Tag a commit that has been merged to main and deployed to staging."
              exit 1
            fi
          done

      - name: Migrate, smoke test, shift traffic
        run: infra/scripts/deploy.sh production "${GITHUB_SHA}"
