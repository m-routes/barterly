name: web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Generated API types match web/openapi/schema.yaml
        run: |
          npm run api:types
          git diff --exit-code -- src/lib/api/schema.d.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - name: Playwright e2e
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: false
          load: true
          tags: barterly-web:ci
          cache-from: type=gha,scope=web
      - name: Image runs as non-root and serves the home page
        run: |
          test "$(docker run --rm --entrypoint id barterly-web:ci -u)" != "0"
          docker run -d --name web -p 8080:8080 barterly-web:ci
          for _ in $(seq 1 20); do curl -fsS localhost:8080/ >/dev/null && break; sleep 1; done
          curl -fsS localhost:8080/ | grep -q "Find talent for your stay"
      - name: Security headers are served
        run: |
          headers="$(curl -fsSI localhost:8080/)"
          echo "$headers" | grep -qi "^content-security-policy:.*frame-ancestors 'none'"
          echo "$headers" | grep -qi "^x-frame-options: DENY"
          echo "$headers" | grep -qi "^x-content-type-options: nosniff"
          echo "$headers" | grep -qi "^strict-transport-security: max-age=31536000"
      - name: Image scan (trivy; fails on fixable high or critical)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: barterly-web:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
