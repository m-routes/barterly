[project]
name = "barterly-backend"
version = "0.1.0"
description = "Barterly API: Django 5 + DRF"
requires-python = ">=3.12,<3.13"
dependencies = [
  "django>=5.1,<6.0",
  "djangorestframework>=3.15",
  "drf-spectacular>=0.28",
  "dj-database-url>=2.3",
  "psycopg[binary,pool]>=3.2",
  "gunicorn>=23.0",
  "django-storages[google]>=1.14.4",
  "uvicorn[standard]>=0.32",
  "uvicorn-worker>=0.3",
  "phonenumberslite>=8.13",
  "sentry-sdk[django]>=2.19",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-django>=4.9",
  "pytest-cov>=6.0",
  "factory-boy>=3.3",
  "coverage[toml]>=7.6",
  "ruff>=0.8",
  "pip-audit>=2.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S106"]
"conftest.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --reuse-db"
testpaths = ["apps"]

[tool.coverage.run]
source = ["apps"]
branch = true
omit = ["**/migrations/*", "**/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
