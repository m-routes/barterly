# Local Postgres for development and tests: docker compose up -d db
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: barterly
      POSTGRES_PASSWORD: barterly
      POSTGRES_DB: barterly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
